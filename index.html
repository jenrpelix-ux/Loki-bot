<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loki Bot - Bot de Discord</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body{background:#0e0e0e;color:#fff;font-family:'Segoe UI',Arial;text-align:center;padding:60px 20px}
h1{font-size:60px;background:linear-gradient(90deg,#5865F2,#EB459E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
p{color:#aaa;font-size:18px;margin-bottom:30px}
.btn{background:#5865F2;color:white;padding:15px 35px;border-radius:10px;text-decoration:none;display:inline-block;margin:10px;font-weight:bold;font-size:16px}
.btn:hover{background:#4752C4}
.card{background:#1f1f1f;padding:25px;border-radius:15px;margin:15px auto;max-width:400px;text-align:left;border:1px solid #333}
h3{color:#5865F2;margin-bottom:8px;font-size:20px}
</style>
</head>
<body>
<h1>👹 LOKI BOT</h1>
<p>Economía, Gacha y Diversión para tu servidor de Discord</p>
<a href="https://discord.com/oauth2/authorize?client_id=TU_CLIENT_ID&permissions=8&scope=bot" class="btn">Invitar a Loki</a>

<div class="card">
  <h3>💰 !daily</h3>
  <p>Reclama 200 coins cada día gratis</p>
</div>

<div class="card">
  <h3>⚒️ !work</h3>
  <p>Trabaja y gana dinero aleatorio</p>
</div>

<div class="card">
  <h3>🎲 !gacha</h3>
  <p>Invoca personajes de 5 estrellas</p>
</div>

<div class="card">
  <h3>🏦 !balance</h3>
  <p>Revisa cuánto dinero tienes</p>
</div>

</body>
    </html>
